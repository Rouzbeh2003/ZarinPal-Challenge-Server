services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zarinpal
      POSTGRES_USER: zarinpal
      POSTGRES_PASSWORD: zarinpal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarinpal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # The dataset lives at backend/data/raw/other_challenge_data.csv.gz on the
      # host; single-file bind mounts are unreliable on Windows, so only the
      # folder is mounted.
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations run before uvicorn on every start; they are idempotent.
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
