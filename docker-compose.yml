services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zarinpal
      POSTGRES_USER: zarinpal
      POSTGRES_PASSWORD: zarinpal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarinpal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./other_challenge_data.csv.gz:/app/data/raw/other_challenge_data.csv.gz:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
