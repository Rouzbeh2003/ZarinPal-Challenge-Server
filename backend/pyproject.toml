[project]
name = "zarinpal-merchant-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "django-ninja>=1.4,<2",
  "duckdb>=1.3,<2",
  "psycopg[binary]>=3.2,<4",
  "dj-database-url>=2.3,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = ["tests*", "data*"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.11,<1",
  "django-stubs>=5.2,<6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
